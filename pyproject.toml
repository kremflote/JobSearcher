[project]
name = "jobsearcher"
version = "0.1.0"
description = "Lokalt, AI-assistert jobbsøkverktøy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
jobsearcher = "jobsearcher.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsearcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
