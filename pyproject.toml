[project]
name = "jobsearcher"
version = "0.1.0"
description = "Lokalt, AI-assistert jobbsøkverktøy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.0",
    "sqlmodel>=0.0.48",
    "typer>=0.27.3",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
jobsearcher = "jobsearcher.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsearcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
