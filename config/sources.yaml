# Aktive kilder og søk (ARCHITECTURE §4, §14).

finn_api:
  enabled: true
  # Appidentitet låst til APK-en gatewayen ble reverse-engineert fra (spike 04). Endres bare
  # sammen med ny APK.
  app_version: "261006-ec709768"
  app_build: "1005273389"
  # Enheten appidentiteten later som den kjører på. Brukes både i app-headerne
  # (x-nmp-os-version, x-nmp-device) og i WebView-User-Agent for annonsesidene, så de må
  # henge sammen. Oppdateres sammen med appversjonen (spike 04).
  os_version: "14"
  device_model: "Pixel 8"
  device_build: "AP2A.240805.005"
  webview_chrome_version: "129.0.6668.100"

  # --- Hensyn til Finn (ARCHITECTURE §4.2) ---
  # Sekunder mellom kall, trukket tilfeldig i [min, maks] per kall.
  gateway_interval_s: [2, 4]      # appsgw.finn.no (søk)
  ad_page_interval_s: [5, 10]     # www.finn.no (annonsesider)
  # Maks annonsesider per kjøring. Resten hentes neste kjøring.
  max_details_per_run: 40
  # Hopp over Finn hvis forrige vellykkede Finn-henting var for under så mange timer siden
  # ("Kjør nå" flere ganger). `jobsearcher run --force` overstyrer. 0 = av.
  min_hours_between_runs: 3
  # Første kjøring (ingen cursor): maks antall sider (à 50 annonser) per søk.
  initial_max_pages: 3
  # Senere kjøringer: sikkerhetsgrense; vi stopper normalt ved cursoren lenge før.
  max_pages: 10
  # Sjekk filter-ID-ene under mot Finns filter-metadata. Ukjente ID-er gir kildehelse "warn".
  validate_filters: true
  # Filter-metadata caches i DATA_DIR/finn_filters.json så mange dager (ett kall per searchkey
  # per periode).
  filter_check_days: 7
  # Felles filtre for alle søk (spike 04 §Oppdatering). Flere verdier = gjentatt parameter.
  common_params:
    occupation: ["0.23"]            # IT utvikling
    work_experience: ["455", "456"] # ingen erfaring, junior
    education: ["465", "464"]       # ingen, høyskole/universitet lavere nivå
  # Søk per id (§4.2). `job_type` er hint til normaliseringen; selve stedsfilteret er
  # `location`-parameteren. Oslo/Akershus trenger ikke eget søk: it_norge dekker dem, og
  # geografien avgjøres lokalt (§5.1). `every_days`: søket kjøres bare så ofte (mangler = hver
  # kjøring). Typesøkene er delmengder av it_norge og gir bare jobbtype-hint, så ukentlig holder.
  searches:
    it_norge:
      searchkey: SEARCH_ID_JOB_FULLTIME
      job_type: permanent
      params:
        location: ["0.20001"]                         # Norge
    trainee:
      searchkey: SEARCH_ID_JOB_FULLTIME
      job_type: trainee
      params:
        location: ["0.20001"]
        job_duration: ["8098"]
      every_days: 7
    graduate:
      searchkey: SEARCH_ID_JOB_FULLTIME
      job_type: graduate
      params:
        location: ["0.20001"]
        q: ["graduate"]
      every_days: 7
    summer:
      searchkey: SEARCH_ID_JOB_FULLTIME
      job_type: summer
      params:
        location: ["0.20001"]
        job_duration: ["1816"]
      every_days: 7

nav:
  enabled: true
  # Feed-API (spike 01). Token fra NAV_FEED_TOKEN i .env.
  base_url: https://pam-stilling-feed.nav.no
  # Første kjøring starter så mange dager tilbake (If-Modified-Since på /api/v1/feed).
  initial_days_back: 7
  # Tidsavbrudd per kall i sekunder. NAV-gatewayen bruker opptil 60 s per feed-side.
  timeout_s: 90
  # Antall nye forsøk ved 5xx/tidsavbrudd. 0: en treg NAV-gateway får hvile, og neste kjøring prøver igjen.
  retries: 0
  # Maks feed-sider per kjøring. Resten leses neste kjøring (cursoren peker på neste side).
  max_pages_per_run: 200

teamtailor:
  enabled: false   # fase 5
  feeds: []

page_watch:
  enabled: false   # fase 5
  companies: []
