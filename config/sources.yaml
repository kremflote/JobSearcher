# Aktive kilder og søk (ARCHITECTURE §4, §14).

finn_api:
  enabled: true
  # Appidentitet låst til APK-en gatewayen ble reverse-engineert fra (spike 04). Endres bare
  # sammen med ny APK.
  app_version: "261006-ec709768"
  app_build: "1005273389"
  # Enheten appidentiteten later som den kjører på. Brukes både i app-headerne
  # (x-nmp-os-version, x-nmp-device) og i WebView-User-Agent for annonsesidene, så de må
  # henge sammen. Oppdateres sammen med appversjonen (spike 04).
  os_version: "14"
  device_model: "Pixel 8"
  device_build: "AP2A.240805.005"
  webview_chrome_version: "129.0.6668.100"

  # --- Hensyn til Finn (ARCHITECTURE §4.2) ---
  # Sekunder mellom kall, trukket tilfeldig i [min, maks] per kall.
  gateway_interval_s: [2, 4]      # appsgw.finn.no (søk)
  ad_page_interval_s: [5, 10]     # www.finn.no (annonsesider)
  # Maks annonsesider per kjøring. Resten hentes neste kjøring.
  max_details_per_run: 40
  # Hopp over Finn hvis forrige vellykkede Finn-henting var for under så mange timer siden
  # ("Kjør nå" flere ganger). `jobsearcher run --force` overstyrer. 0 = av.
  min_hours_between_runs: 3
  # Første kjøring (ingen cursor): maks antall sider (à 50 annonser) per søk.
  initial_max_pages: 3
  # Senere kjøringer: sikkerhetsgrense; vi stopper normalt ved cursoren lenge før.
  max_pages: 10
  # Sjekk filter-ID-ene under mot Finns filter-metadata. Ukjente ID-er gir kildehelse "warn".
  validate_filters: true
  # Filter-metadata caches i DATA_DIR/finn_filters.json så mange dager (ett kall per searchkey
  # per periode).
  filter_check_days: 7
  # Felles filtre for alle søk (spike 04 §Oppdatering). Flere verdier = gjentatt parameter.
  common_params:
    occupation: ["0.23"]            # IT utvikling
    work_experience: ["455", "456"] # ingen erfaring, junior
    education: ["465", "464"]       # ingen, høyskole/universitet lavere nivå
  # Søk per id (§4.2). `job_type` er hint til normaliseringen; selve stedsfilteret er
  # `location`-parameteren. Oslo/Akershus trenger ikke eget søk: it_norge dekker dem, og
  # geografien avgjøres lokalt (§5.1). `every_days`: søket kjøres bare så ofte (mangler = hver
  # kjøring). Typesøkene er delmengder av it_norge og gir bare jobbtype-hint, så ukentlig holder.
  searches:
    it_norge:
      searchkey: SEARCH_ID_JOB_FULLTIME
      job_type: permanent
      params:
        location: ["0.20001"]                         # Norge
    trainee:
      searchkey: SEARCH_ID_JOB_FULLTIME
      job_type: trainee
      params:
        location: ["0.20001"]
        job_duration: ["8098"]
      every_days: 7
    graduate:
      searchkey: SEARCH_ID_JOB_FULLTIME
      job_type: graduate
      params:
        location: ["0.20001"]
        q: ["graduate"]
      every_days: 7
    summer:
      searchkey: SEARCH_ID_JOB_FULLTIME
      job_type: summer
      params:
        location: ["0.20001"]
        job_duration: ["1816"]
      every_days: 7

nav:
  enabled: true
  # Feed-API (spike 01). Token fra NAV_FEED_TOKEN i .env.
  base_url: https://pam-stilling-feed.nav.no
  # Første kjøring starter så mange dager tilbake (If-Modified-Since på /api/v1/feed).
  initial_days_back: 7
  # Tidsavbrudd per kall i sekunder. NAV-gatewayen bruker opptil 60 s per feed-side.
  timeout_s: 90
  # Antall nye forsøk ved 5xx/tidsavbrudd. 0: en treg NAV-gateway får hvile, og neste kjøring prøver igjen.
  retries: 0
  # Maks feed-sider per kjøring. Resten leses neste kjøring (cursoren peker på neste side).
  max_pages_per_run: 200

# --- Fase 5: trainee-, graduate- og sommerkilder (ARCHITECTURE §4.4, spike 03) ---
# Kuratert selskapsliste. Selskaper som ikke står her (Workday, SmartRecruiters, sider som bare
# lastes med JavaScript) dekkes av NAV og Finn; se spike 03 §Oppdatering 2026-10-11.
# Felles for begge: `key` er cursor-nøkkelen (endres den, leses kilden som ny), `company` er
# navnet jobben får (brukes ved dedupe mot NAV og Finn), `job_type` er valgfritt hint.

teamtailor:
  enabled: true
  # Hopp over en feed som ble lest for under så mange timer siden ("Kjør nå" flere ganger).
  # `jobsearcher run --force` overstyrer.
  min_hours_between_runs: 3
  # Offentlig RSS per karriereside: https://<karriereside>/jobs.rss. Hele annonseteksten står i
  # feeden. En stilling som forsvinner fra feeden blir inaktiv.
  feeds:
    - { key: vipps, company: Vipps MobilePay, url: "https://vipps.teamtailor.com/jobs.rss" }
    - { key: hafslund, company: Hafslund, url: "https://hafslund.teamtailor.com/jobs.rss" }
    - { key: akerbp, company: Aker BP, url: "https://akerbp.teamtailor.com/jobs.rss" }
    - { key: schibsted, company: Schibsted, url: "https://schibsted.teamtailor.com/jobs.rss" }
    - { key: skatteetaten, company: Skatteetaten, url: "https://skatteetaten.teamtailor.com/jobs.rss" }
    - { key: computas, company: Computas, url: "https://computas.teamtailor.com/jobs.rss" }
    - { key: itera, company: Itera, url: "https://itera.teamtailor.com/jobs.rss" }
    - { key: twoday, company: Twoday, url: "https://twoday.teamtailor.com/jobs.rss" }
    - { key: oda, company: Oda, url: "https://careers.oda.com/jobs.rss" }

page_watch:
  enabled: true
  # Hver side hentes maks én gang per så mange timer. `run --force` overstyrer.
  min_hours_between_checks: 20
  # Maks utlysningssider (lenker fra karrieresidene) som hentes per kjøring.
  max_details_per_run: 30
  # Karrieresider uten feed. Siden gjøres om til tekst og hashes; bare ved endring leser
  # extractor-agenten (tier fast) ut utlysningene. `selector` (CSS) avgrenser delen som
  # overvåkes, ellers brukes <main>. En utlysning som forsvinner fra siden blir inaktiv.
  companies:
    - { key: bekk, company: Bekk, url: "https://www.bekk.no/jobb" }
    - { key: kantega, company: Kantega, url: "https://jobb.kantega.no/" }
    - { key: variant, company: Variant, url: "https://www.variant.no/no/jobb" }
    - { key: knowit, company: Knowit, url: "https://www.knowit.no/jobb-hos-oss/talentprogram-og-sommerstudenter/" }
    - { key: soprasteria, company: Sopra Steria, url: "https://www.soprasteria.no/bli-en-av-oss" }
    - { key: capgemini, company: Capgemini, url: "https://www.capgemini.com/no-no/careers/career-paths/students-and-graduates/" }
    - { key: netcompany, company: Netcompany, url: "https://netcompany.com/careers/vacancies/" }
    - { key: kongsberg, company: Kongsberg, url: "https://www.kongsberg.com/careers/vacancies/" }
    - { key: nrk, company: NRK, url: "https://info.nrk.no/karriere/" }
    - { key: statnett, company: Statnett, url: "https://www.statnett.no/karriere/for-studenter-og-larlinger/" }
    - { key: dnb, company: DNB, url: "https://www.dnb.no/om-oss/jobb-og-karriere/studenter-og-nyutdannede" }
    - { key: gjensidige, company: Gjensidige, url: "https://www.gjensidige.no/om-oss/jobb/student" }
    - { key: telenor, company: Telenor, url: "https://www.telenor.no/om/jobbitelenor/" }
    - { key: vegvesen, company: Statens vegvesen, url: "https://www.vegvesen.no/om-oss/jobb/traineeprogram/", job_type: trainee }
